name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y zsh shellcheck
      - run: go install mvdan.cc/sh/v3/cmd/shfmt@v3.14.1
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -o zsh-lint .
      - run: ./zsh-lint --version
      - run: ./zsh-lint .
